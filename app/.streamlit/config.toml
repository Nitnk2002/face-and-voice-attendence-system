[global]
suppressDeprecationWarnings = true

[server]
headless = true
address = "localhost"
port = 8501

[browser]
gatherUsageStats = false

[logger]
level = "error"

[theme]
base = "light"
primaryColor = "#533afd"
backgroundColor = "#f6f9fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0d253d"
font = "sans serif"
